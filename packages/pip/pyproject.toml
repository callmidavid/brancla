[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brancla"
version = "1.0.2"
description = "Safe local Git dead branch sweeper synced with GitHub and GitLab."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Brancla" }
]
keywords = ["git", "branches", "cli", "cleanup", "github", "gitlab"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git"
]

[project.urls]
Homepage = "https://github.com/callmidavid/brancla"
Repository = "https://github.com/callmidavid/brancla"
Issues = "https://github.com/callmidavid/brancla/issues"

[project.scripts]
brancla = "brancla_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
